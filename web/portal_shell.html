<!-- COILCLASH CUSTOM SHELL — CCPortal bridge + Godot default shell body. -->
<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<script>
/* CoilClash §45.1/§45.2 portal bridge — installed by the CUSTOM HTML shell.
 * window.CCPortal routes the game's ad/lifecycle calls to whichever portal
 * SDK is on the page (Poki / CrazyGames / GameDistribution), or to an
 * instant-resolve MOCK when none is present (dev + verification builds).
 * The GDScript side (AdProviderWebPortal) only ever talks to CCPortal. */
window.CCPortal = (function () {
	"use strict";
	function pokiAdapter(P) {
		return {
			commercialBreak: (ok, err) => { P.commercialBreak().then(ok).catch(err); },
			rewardedBreak: (ok, err) => { P.rewardedBreak().then((v) => ok(!!v)).catch(err); },
			gameplayStart: () => { P.gameplayStart(); },
			gameplayStop: () => { P.gameplayStop(); },
			gameLoadingFinished: () => { if (P.gameLoadingFinished) { P.gameLoadingFinished(); } },
		};
	}
	function crazyAdapter(C) {
		return {
			commercialBreak: (ok, err) => { C.SDK.ad.requestAd("midgame", { adFinished: ok, adError: err }); },
			rewardedBreak: (ok, err) => { C.SDK.ad.requestAd("rewarded", { adFinished: () => ok(true), adError: err }); },
			gameplayStart: () => { C.SDK.game.gameplayStart(); },
			gameplayStop: () => { C.SDK.game.gameplayStop(); },
			gameLoadingFinished: () => {},
		};
	}
	function gdAdapter(G) {
		return {
			commercialBreak: (ok, err) => { G.showAd("midgame").then(ok).catch(err); },
			rewardedBreak: (ok, err) => { G.showAd("rewarded").then(() => ok(true)).catch(err); },
			gameplayStart: () => {},
			gameplayStop: () => {},
			gameLoadingFinished: () => {},
		};
	}
	const mockCounts = { commercialBreak: 0, rewardedBreak: 0 };
	function mockAdapter() {
		return {
			commercialBreak: (ok, _err) => { mockCounts.commercialBreak++; setTimeout(ok, 250); },
			rewardedBreak: (ok, _err) => { mockCounts.rewardedBreak++; setTimeout(() => ok(true), 500); },
			gameplayStart: () => {},
			gameplayStop: () => {},
			gameLoadingFinished: () => {},
		};
	}
	let adapter = null;
	let id = null;
	const forceMock = new URLSearchParams(window.location.search).get("cc_portal") === "mock";
	if (!forceMock && window.PokiSDK) { adapter = pokiAdapter(window.PokiSDK); id = "poki"; }
	else if (!forceMock && window.CrazyGames) { adapter = crazyAdapter(window.CrazyGames); id = "crazygames"; }
	else if (!forceMock && (window.gdsdk || window.GDSdk)) { adapter = gdAdapter(window.gdsdk || window.GDSdk); id = "gamedistribution"; }
	else { adapter = mockAdapter(); id = "mock"; }
	return {
		detect: () => id,
		commercialBreak: (ok, err) => adapter.commercialBreak(ok, err),
		rewardedBreak: (ok, err) => adapter.rewardedBreak(ok, err),
		gameplayStart: () => adapter.gameplayStart(),
		gameplayStop: () => adapter.gameplayStop(),
		gameplayFinished: () => adapter.gameLoadingFinished(),
		mockCounts: mockCounts,
	};
})();
		</script>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
